services:
  - type: web
    name: telegram-movie-bot
    env: python
    buildCommand: "pip install -r requirements.txt"
    startCommand: "python bot.py"
    plan: free
    autoDeploy: true
    envVars:
      - key: API_ID
        sync: false
      - key: API_HASH
        sync: false
      - key: BOT_TOKEN
        sync: false
      - key: OWNER_ID
        sync: false
      - key: ADMINS
        sync: false
      - key: SEARCH_CHANNEL_ID
        sync: false
      - key: UPDATE_CHANNEL_ID
        sync: false
      - key: UPDATE_CHANNEL_LINK
        sync: false
      - key: STORAGE_CHANNEL_ID
        sync: false
      - key: MOVIE_CHANNEL_ID
        sync: false
      - key: LOG_CHANNEL_ID
        sync: false
      - key: MONGODB_URI
        sync: false
      - key: DATABASE_NAME
        value: "movie_management_db"
      - key: TMDB_API_KEY
        sync: false
      - key: SHORTLINK_URL
        sync: false
      - key: SHORTLINK_API
        sync: false
      - key: PORT
        value: 8080
      - key: HOST
        value: 0.0.0.0
